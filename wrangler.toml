name = "feedback"
main = "worker.js"
compatibility_date = "2024-09-25"
workers_dev = false

# Workers Static Assets (not legacy Workers Sites): asset reads aren't KV
# operations, so scanner traffic doesn't burn the KV quota. Every request runs
# through worker.js so it can add security headers and inject Umami.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[vars]
UMAMI_SITE_ID = "5aa66ec5-3a45-4449-bb89-17e092da725c"

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "devlab502-uploads"

[env.production]
routes = [
  { pattern = "feedback.devlab502.net", custom_domain = true }
]

[env.production.vars]
UMAMI_SITE_ID = "5aa66ec5-3a45-4449-bb89-17e092da725c"
